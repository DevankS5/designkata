name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The integration tests run against a real MongoDB binary; keep it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - name: No em dashes, en dashes or API keys
        run: npm run check:text
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
